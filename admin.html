<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت آهنگ‌ها</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }
        .container {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffd93d;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
        }
        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #2a2a4e;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #ffd93d;
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #f5c92e;
            transform: scale(1.02);
        }
        #message {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        #message.success {
            display: block;
            background: #2e7d32;
            color: #a5d6a7;
        }
        #message.error {
            display: block;
            background: #7d2e2e;
            color: #ef9a9a;
        }
        .info {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 مدیریت آهنگ فعال</h1>
        
        <label for="songSelector">آهنگ مورد نظر را انتخاب کنید:</label>
        <select id="songSelector">
            <option value="1">آهنگ شماره یک</option>
            <option value="2">آهنگ شماره دو</option>
            <option value="3">آهنگ شماره سه</option>
        </select>

        <button onclick="updateSong()">تغییر آهنگ فعال</button>
        
        <div id="message"></div>
        <p class="info">پس از تغییر، کیوآر کد همان قبلی است اما آهنگ جدید پخش می‌شود.</p>
    </div>

    <script>
        // =============================================
        // لینک JSONBin خود را اینجا قرار دهید (مرحله 3)
        // =============================================
        const CONFIG_URL = 'https://api.jsonbin.io/v3/b/6a878c4cf5f4af5e292eeecd';
        const API_KEY = '$2a$10$FwBGNIg5D7KpVlpc39iyxeXedS/K7uVXQbGhZyKyJXUCRN67fnljW';

        async function updateSong() {
            const messageEl = document.getElementById('message');
            const songId = document.getElementById('songSelector').value;

            // مخفی کردن پیام قبلی
            messageEl.style.display = 'none';
            messageEl.className = '';

            try {
                // 1. دریافت تنظیمات فعلی
                const getResponse = await fetch(CONFIG_URL, {
                    headers: {
                        'X-Master-Key': API_KEY
                    }
                });

                if (!getResponse.ok) {
                    throw new Error('خطا در دریافت تنظیمات');
                }

                const data = await getResponse.json();
                const config = data.record;

                // 2. تغییر آهنگ فعال
                config.active_song = parseInt(songId);

                // 3. ذخیره تنظیمات جدید در JSONBin
                const putResponse = await fetch(CONFIG_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(config)
                });

                if (!putResponse.ok) {
                    throw new Error('خطا در ذخیره تنظیمات');
                }

                // پیام موفقیت
                messageEl.textContent = '✅ آهنگ با موفقیت تغییر کرد!';
                messageEl.className = 'success';
                messageEl.style.display = 'block';

            } catch (error) {
                console.error('خطا:', error);
                messageEl.textContent = '❌ خطا: ' + error.message;
                messageEl.className = 'error';
                messageEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>
